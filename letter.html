<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Angelica's Letter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    #letter {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform: scale(1.15);
      transform-origin: center;
    }

    #close-button {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 38px;
      height: 38px;
      padding: 0;

      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 27px;
      line-height: 1;

      cursor: pointer;
      user-select: none;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    #close-button:hover {
      background: rgba(90, 0, 0, 0.9);
      transform: scale(1.08);
    }

    #close-button:active {
      transform: scale(0.94);
    }
  </style>
</head>

<body>
  <img id="letter" alt="Angelica's letter">

  <button
    id="close-button"
    type="button"
    aria-label="Close letter"
  >
    ×
  </button>

  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const imageName = params.get("image") || "L1.PNG";

    const allowedImages = [
      "L1.PNG",
      "L2.PNG",
      "L3.PNG",
      "L4.PNG",
      "L5.PNG",
      "Last letter.jpg"
    ];

    const letterImage = document.getElementById("letter");
    const closeButton = document.getElementById("close-button");

    if (allowedImages.includes(imageName)) {
      letterImage.src = imageName;
    } else {
      letterImage.src = "L1.PNG";
    }

    function closeLetter() {
      if (
        typeof PortalsSdk !== "undefined" &&
        typeof PortalsSdk.closeIframe === "function"
      ) {
        PortalsSdk.closeIframe();
      }
    }

    closeButton.addEventListener("click", closeLetter);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeLetter();
      }
    });
  </script>
</body>
</html>
